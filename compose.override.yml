x-dev-env: &dev-env
  FASTAPI_ENV: "development"
  SMTP_HOST: "mailpit"
  SMTP_PORT: "1025"
  SMTP_TLS: "false"

x-celery-develop: &celery-develop
  watch:
    - path: ./backend
      action: sync+restart
      target: /app/backend
      ignore:
        - .venv
    - path: ./backend/pyproject.toml
      action: rebuild

services:

  proxy:
    ports:
      - "80:80"

  db:
    ports:
      - "5432:5432"

  adminer:
    ports:
      - "8080:8080"

  redis-cache:
    ports:
      - "6379:6379"

  redis-broker:
    ports:
      - "6380:6379"

  rustfs:
    ports:
      - "9000:9000"
      # Web console
      - "9001:9001"

  elasticsearch:
    ports:
      - "9200:9200"

  prestart:
    environment: *dev-env

  backend:
    # No host port: three replicas can't share one. Use http://localhost (nginx).
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment: *dev-env

  celery-worker:
    environment: *dev-env
    develop: *celery-develop

  celery-beat:
    environment: *dev-env
    develop: *celery-develop

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
