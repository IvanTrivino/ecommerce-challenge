services:

  proxy:
    restart: always
    ports:
      # Listen on port 80 (ACME challenges + redirect to HTTPS)
      - "80:80"
      # Listen on port 443, default for HTTPS
      - "443:443"
    volumes:
      # Replaces the HTTP-only config from compose.yml
      - ./nginx/deploy:/etc/nginx/templates:ro
      # Certificates issued by certbot on the host
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for certbot's HTTP-01 challenge
      - /var/www/certbot:/var/www/certbot:ro

  db:
    restart: always

  adminer:
    restart: always

  redis-cache:
    restart: always

  redis-broker:
    restart: always

  rustfs:
    restart: always

  elasticsearch:
    restart: always

  backend:
    restart: always
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}

  celery-worker:
    restart: always

  celery-beat:
    restart: always
